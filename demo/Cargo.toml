[workspace]
# A workspace of its own, not a member of the root crate: the demo is not part
# of the gateway's `make check`.
resolver = "3"
members = ["wallet", "market", "client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3", features = [
    "client",
    "reqwest",
    "server",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
