[project]
name = "demo-agent"
version = "0.1.0"
description = "A LangChain agent for the proveno-gateway demo: the model writes the program"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.1",
    "langchain-anthropic>=1.7.2",
    "langchain-core>=1.6.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.2",
]

[project.scripts]
demo-agent = "demo_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
